<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great Journey</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#eee8ff,#fff3d6);color:#172033}
main{max-width:680px;margin:auto;padding:16px}.hero,.card{background:#fffdf8;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 5px 20px #0001}
.hero{background:#172033;color:white}.hero h1{font-size:38px;margin:6px 0}.tag{font-size:12px;letter-spacing:1.5px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center}.badge{background:#eee8ff;color:#5038c8;padding:7px 11px;border-radius:99px;font-weight:800}.bar{height:10px;background:#ddd;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#6d4aff}
h2{margin:0 0 8px}p{font-size:17px;line-height:1.4}.btn{width:100%;padding:15px;border:0;border-radius:15px;background:#6d4aff;color:white;font-size:17px;font-weight:800;margin-top:8px}.done{display:none;background:#e5f7e9;padding:12px;border-radius:14px;margin-top:10px;font-weight:800}.chaos{background:#fff0f6;border:2px dashed #ff75a5}
small{opacity:.65}.footer{text-align:center;opacity:.5;font-size:12px;margin:22px}
</style></head><body><main>
<section class="hero"><div class="tag">TOP SECRET • MISSION 001</div><h1>THE GREAT JOURNEY</h1><p id="welcome">Welcome, Agent.</p></section>
<section class="card row"><div><span class="badge" id="agent">AGENT</span><br><small>Personal mission profile</small></div><strong id="xp">0 XP</strong></section>
<section class="card"><strong>Mission progress</strong><div class="bar"><div class="fill" id="fill"></div></div><small id="progress">0 of 5 complete</small></section>
<div id="missions"></div>
<section class="card chaos"><h2>🎲 Chaos Mission</h2><p id="chaos">Need something ridiculous?</p><button class="btn" onclick="chaosMission()">ACTIVATE CHAOS</button></section>
<div class="footer">The Great Journey • Mission Control © Vicky O’Dell</div>
</main><script>
const q=new URLSearchParams(location.search), a=(q.get('agent')||'agent').toLowerCase(), n={lydia:'Lydia',grace:'Grace'}[a]||a[0].toUpperCase()+a.slice(1), k='greatJourney_'+a;
let s=JSON.parse(localStorage.getItem(k)||'{"done":[],"xp":0}');
document.getElementById('welcome').textContent='Welcome, Agent '+n+'. Mission Control is watching.';
document.getElementById('agent').textContent='AGENT '+n.toUpperCase();
const ms=[
['🔎 Mission 1 — Spotter','Passenger only! Find a vehicle in an unusual or brilliant colour.','MISSION COMPLETE'],
['🔤 Mission 2 — Letter Hunt','Find the letter <b>'+['G','J','M','S','T','A','R'][(n.length+2)%7]+'</b> outside the car — a sign, shop, vehicle or building.','FOUND IT!'],
['😂 Mission 3 — Weirdness Detector','Spot something that makes you laugh, wonder, or say “What on earth is THAT?”','WE FOUND SOMETHING'],
['🤝 Mission 4 — Two-Agent Challenge','Both agents agree on the best-looking thing you have passed. Invent a secret codename for it.','AGENTS AGREE'],
['🏁 Mission 5 — Final Transmission','Near the destination, each agent says one word describing the journey. Combine them into your final secret message.','SEND FINAL TRANSMISSION']
];
function draw(){document.getElementById('missions').innerHTML=ms.map((m,i)=>`<section class="card"><h2>${m[0]}</h2><p>${m[1]}</p><button class="btn" ${s.done.includes(i+1)?'disabled':''} onclick="complete(${i+1})">${s.done.includes(i+1)?'COMPLETED ✓':m[2]}</button><div class="done" id="d${i+1}" style="display:${s.done.includes(i+1)?'block':'none'}">${i===4?'🏆 MISSION 001 COMPLETE! +50 XP':'⭐ Excellent work, Agent. +20 XP'}</div></section>`).join('');
document.getElementById('xp').textContent=s.xp+' XP';document.getElementById('progress').textContent=s.done.length+' of 5 complete';document.getElementById('fill').style.width=s.done.length*20+'%';localStorage.setItem(k,JSON.stringify(s))}
function complete(i){if(s.done.includes(i))return;s.done.push(i);s.xp+=i===5?50:20;draw()}
const chaos=['Do your best spy pose for 5 seconds.','Find something yellow.','Invent a ridiculous name for the next roundabout.','Everyone says “CLASSIFIED!” at the same time.','Spot a dog — bonus points if it looks like it is on a mission.','Give a random object a secret-agent codename.'];
function chaosMission(){document.getElementById('chaos').textContent=chaos[Math.floor(Math.random()*chaos.length)]}draw();
</script></body></html>
