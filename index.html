<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great Journey</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff7fb,#eee9ff);color:#202033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #0001}h1{margin:0 0 5px;font-size:30px}.agent{font-size:20px;font-weight:800}.xp{font-size:18px;font-weight:700;margin-top:4px}.mission{border:2px solid #eee8ff;border-radius:16px;padding:15px;margin:12px 0}.pending{background:#fff9e9;border-color:#f0d48b}.done{background:#f1fff5;border-color:#b7e8c4}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:9px;font-size:17px;font-weight:800;background:#6847f5;color:#fff}.secondary{background:#eeeafc;color:#403080}.small{font-size:14px;color:#666}.success{font-size:18px;font-weight:800}</style></head><body><div class="wrap" id="game"><div class="card"><h1>THE GREAT JOURNEY</h1><div class="agent" id="agentName">Agent</div><div class="xp" id="xp">0 XP</div><p class="small">Mission 001 • The Great Journey</p></div><div class="card"><h2>Mission Status</h2><p id="status">0 of 5 missions completed.</p><div id="missions"></div></div><div class="card"><h2>🎲 Chaos Mission</h2><p id="chaos">Ready when you are.</p><button class="secondary" id="chaosButton">GIVE US A CHAOS MISSION</button></div></div><script>
(function(){"use strict";var missions=[{title:"Spotter",text:"Passenger mission: spot an unusual or brilliant-coloured vehicle. Tell Mission Control what you found.",xp:20},{title:"Letter Hunt",text:"Find a letter outside the car. It can be on a sign, shop, van, road sign or anything else you can safely see.",xp:20},{title:"Weirdness Detector",text:"Spot something funny, strange or unexpected. What did you notice?",xp:20},{title:"Two-Agent Challenge",text:"Together, agree on the best-looking thing you can see and give it a secret-agent codename.",xp:20},{title:"Final Transmission",text:"Each Agent chooses ONE word. Put the two words together to create your final secret message.",xp:50}];var names={lydia:"Agent Lydia",grace:"Agent Grace"};var adults={vicky:"Director Vicky",matt:"Mission Control Matt",loretta:"Chief Intelligence Officer Loretta"};var params=new URLSearchParams(window.location.search),agent=params.get("agent")||"lydia",verifier=params.get("verify");function get(k,f){try{return localStorage.getItem(k)||f}catch(e){return f}}function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}function state(){var raw=get("greatJourney_"+agent,'{"completed":[],"pending":[],"xp":0,"approvals":[]}');try{return JSON.parse(raw)}catch(e){return {completed:[],pending:[],xp:0,approvals:[]}}}function save(s){put("greatJourney_"+agent,JSON.stringify(s))}function renderNormal(){var s=state();document.getElementById("agentName").textContent=names[agent]||"Agent";document.getElementById("xp").textContent=s.xp+" XP";document.getElementById("status").textContent=s.completed.length+" of "+missions.length+" missions completed.";var next=-1;for(var n=0;n<missions.length;n++){if(s.completed.indexOf(n)===-1){next=n;break}}var box=document.getElementById("missions");box.innerHTML="";missions.forEach(function(m,i){var d=document.createElement("div");d.className="mission";var h=document.createElement("h3");h.textContent="Mission "+(i+1)+": "+m.title;d.appendChild(h);var p=document.createElement("p");p.textContent=m.text;d.appendChild(p);if(s.completed.indexOf(i)!==-1){d.className+=" done";var x=document.createElement("div");x.className="success";x.textContent="✓ APPROVED — +"+m.xp+" XP";d.appendChild(x)}else if(s.pending.indexOf(i)!==-1){d.className+=" pending";var x=document.createElement("div");x.innerHTML="<b>AWAITING MISSION CONTROL</b><p class='small'>An adult needs to check this mission and approve it.</p>";d.appendChild(x)}else if(i===next){var b=document.createElement("button");b.textContent="I HAVE COMPLETED THIS MISSION";b.onclick=function(){var q=state();if(q.pending.indexOf(i)===-1&&q.completed.indexOf(i)===-1){q.pending.push(i);save(q);renderNormal()}};d.appendChild(b)}else{var b=document.createElement("button");b.disabled=true;b.textContent="LOCKED";d.appendChild(b)}box.appendChild(d)});if(s.completed.length===missions.length){var f=document.createElement("div");f.className="card";f.innerHTML="<div class='success'>🏆 MISSION 001 COMPLETE!</div><p>Report to Mission Control to claim your reward.</p>";document.getElementById("game").appendChild(f)}}function renderVerify(){var s=state();document.getElementById("agentName").textContent=adults[verifier]||"Mission Control";document.getElementById("xp").textContent="MISSION CONTROL";document.getElementById("status").textContent="Reviewing missions for "+(names[agent]||"Agent")+".";var box=document.getElementById("missions");box.innerHTML="";missions.forEach(function(m,i){var d=document.createElement("div");d.className="mission";var h=document.createElement("h3");h.textContent="Mission "+(i+1)+": "+m.title;d.appendChild(h);if(s.completed.indexOf(i)!==-1){d.className+=" done";var x=document.createElement("div");x.className="success";x.textContent="✓ Already approved";d.appendChild(x)}else if(s.pending.indexOf(i)!==-1){d.className+=" pending";var p=document.createElement("p");p.textContent="This mission is waiting for approval.";d.appendChild(p);var b=document.createElement("button");b.textContent="APPROVE MISSION — +"+m.xp+" XP";b.onclick=function(){var q=state();if(q.pending.indexOf(i)!==-1&&q.completed.indexOf(i)===-1){q.pending=q.pending.filter(function(x){return x!==i});q.completed.push(i);q.xp+=m.xp;q.approvals.push({mission:i,adult:verifier,when:new Date().toISOString()});save(q);renderVerify()}};d.appendChild(b)}else{var p=document.createElement("p");p.className="small";p.textContent="No approval needed yet.";d.appendChild(p)}box.appendChild(d)});document.getElementById("chaosButton").style.display="none";document.getElementById("chaos").textContent="Mission Control access"}document.getElementById("chaosButton").onclick=function(){var a=["Find three things that are the same colour.","Spot the most ridiculous vehicle you can.","Invent a secret code word for the next five minutes.","Find something shaped like a circle.","Give the next interesting object you see a secret-agent name.","Both Agents point at something at exactly the same time!"];document.getElementById("chaos").textContent=a[Math.floor(Math.random()*a.length)]};put("greatJourney_activeAgent",agent);if(verifier)renderVerify();else renderNormal()})();
</script></body></html>
