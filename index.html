<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Journey</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#fff7fb,#eee9ff);color:#202033}
  .wrap{max-width:680px;margin:auto;padding:22px}
  .card{background:white;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #00000012}
  h1{margin:0 0 6px;font-size:32px}
  h2{margin:0 0 10px}
  .agent{font-weight:700;font-size:20px}
  .xp{font-size:18px;font-weight:700}
  button{width:100%;border:0;border-radius:14px;padding:15px 18px;margin-top:10px;font-size:17px;font-weight:700;background:#6847f5;color:white}
  button.secondary{background:#eeeafc;color:#403080}
  button:disabled{opacity:.45}
  .mission{border:2px solid #eee8ff;border-radius:16px;padding:16px;margin:12px 0}
  .done{background:#f1fff5;border-color:#b7e8c4}
  .pending{background:#fff9e9;border-color:#f1d58b}
  .badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eeeafc;margin:3px;font-size:13px}
  .small{font-size:14px;color:#666}
  .hide{display:none}
  .success{font-size:20px;font-weight:800}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const missions = [
 {title:"Spotter", text:"Passenger mission: spot an unusual or brilliant-coloured vehicle. Tell Mission Control what you found.", xp:20},
 {title:"Letter Hunt", text:"Find a letter outside the car. It can be on a sign, shop, van, road sign or anything else you can safely see.", xp:20},
 {title:"Weirdness Detector", text:"Spot something funny, strange or unexpected. What did you notice?", xp:20},
 {title:"Two-Agent Challenge", text:"Together, agree on the best-looking thing you can see and give it a secret-agent codename.", xp:20},
 {title:"Final Transmission", text:"Each Agent chooses ONE word. Put the two words together to create your final secret message.", xp:50}
];

const names={lydia:"Agent Lydia",grace:"Agent Grace"};
const adultNames={vicky:"Director Vicky",matt:"Mission Control Matt",loretta:"Chief Intelligence Officer Loretta"};

let params=new URLSearchParams(location.search);
let agent=params.get("agent") || localStorage.getItem("greatJourney_activeAgent") || "lydia";
let verify=params.get("verify");
localStorage.setItem("greatJourney_activeAgent",agent);

function key(){return "greatJourney_"+agent}
function state(){
 let s=JSON.parse(localStorage.getItem(key())||'{"completed":[],"pending":[],"xp":0,"approvals":[]}');
 return s;
}
function save(s){localStorage.setItem(key(),JSON.stringify(s));render();}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function render(){
 if(verify){renderVerify();return;}
 let s=state();
 let next=missions.findIndex((m,i)=>!s.completed.includes(i));
 let completed=s.completed.length;
 document.getElementById("app").innerHTML=`
 <div class="card">
   <h1>THE GREAT JOURNEY</h1>
   <div class="agent">${names[agent]||"Agent"}</div>
   <div class="xp">${s.xp} XP</div>
   <p class="small">Mission 001 • The Great Journey</p>
 </div>
 <div class="card">
   <h2>Mission Status</h2>
   <p>${completed} of ${missions.length} missions completed.</p>
   ${missions.map((m,i)=>{
     let done=s.completed.includes(i), pending=s.pending.includes(i);
     return `<div class="mission ${done?"done":pending?"pending":""}">
       <h3>Mission ${i+1}: ${m.title}</h3>
       <p>${m.text}</p>
       ${done?`<div class="success">✓ APPROVED — +${m.xp} XP</div>`:
       pending?`<div><b>AWAITING MISSION CONTROL</b><p class="small">An adult needs to check this mission and approve it.</p></div>`:
       i===next?`<button onclick="completeMission(${i})">I HAVE COMPLETED THIS MISSION</button>`:
       `<button disabled>LOCKED</button>`}
     </div>`;
   }).join("")}
 </div>
 <div class="card">
   <h2>🎲 Chaos Mission</h2>
   <p id="chaos">Ready when you are.</p>
   <button class="secondary" onclick="chaos()">GIVE US A CHAOS MISSION</button>
 </div>
 ${completed===missions.length?`<div class="card"><div class="success">🏆 MISSION 001 COMPLETE!</div><p>Report to Mission Control to claim your reward.</p></div>`:""}
 `;
}

function completeMission(i){
 let s=state();
 if(!s.pending.includes(i) && !s.completed.includes(i)){
   s.pending.push(i); save(s);
 }
}
function chaos(){
 const ideas=[
 "Find three things that are the same colour.",
 "Spot the most ridiculous vehicle you can.",
 "Invent a secret code word for the next five minutes.",
 "Find something shaped like a circle.",
 "Give the next interesting object you see a secret-agent name.",
 "Both Agents point at something at exactly the same time!"
 ];
 document.getElementById("chaos").textContent=ideas[Math.floor(Math.random()*ideas.length)];
}

function renderVerify(){
 let s=state(), adult=adultNames[verify]||"Mission Control";
 document.getElementById("app").innerHTML=`
 <div class="card">
   <h1>MISSION CONTROL</h1>
   <div class="agent">${esc(adult)}</div>
   <p>Reviewing missions for <b>${esc(names[agent]||"Agent")}</b>.</p>
 </div>
 <div class="card">
 ${missions.map((m,i)=>{
   let pending=s.pending.includes(i),done=s.completed.includes(i);
   return `<div class="mission ${done?"done":pending?"pending":""}">
    <h3>Mission ${i+1}: ${m.title}</h3>
    ${done?`<div class="success">✓ Already approved</div>`:
      pending?`<p>This mission is waiting for approval.</p><button onclick="approve(${i})">APPROVE MISSION — +${m.xp} XP</button>`:
      `<p class="small">No approval needed yet.</p>`}
   </div>`;
 }).join("")}
 </div>
 <div class="card small">This is the family-game Mission Control check. It is not intended as secure authentication.</div>
 `;
}
function approve(i){
 let s=state();
 if(!s.pending.includes(i)||s.completed.includes(i)) return;
 s.pending=s.pending.filter(x=>x!==i);
 s.completed.push(i);
 s.xp+=missions[i].xp;
 s.approvals.push({mission:i,adult:verify,when:new Date().toISOString()});
 save(s);
}
render();
</script>
</body>
</html>
